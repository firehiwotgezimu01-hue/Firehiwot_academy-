
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Firehiwot Academy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1025;
      color: white;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      margin: 30px auto;
      padding: 24px;
      background: #18213c;
      border-radius: 16px;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 9px 0;
      border-radius: 8px;
      border: 1px solid #64748b;
    }
    button {
      background: #8b5cf6;
      color: white;
      font-weight: bold;
    }
    a { color: #c4b5fd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Firehiwot Academy 🎓</h1>
    <h2>Student Registration</h2>

    <form id="registerForm">
      <label for="studentName">Full name</label>
      <input id="studentName" name="studentName"
        autocomplete="name" required maxlength="80">

      <label for="email">Email address</label>
      <input id="email" name="email" type="email"
        autocomplete="email" required maxlength="120">

      <label for="grade">Grade</label>
      <select id="grade" name="grade" required>
        <option value="">Choose your grade</option>
        <option>Grade 9</option>
        <option>Grade 10</option>
        <option>Grade 11</option>
        <option>Grade 12</option>
      </select>

      <button type="submit">Register</button>
    </form>

    <p id="message" role="status"></p>
    <p><a href="index.html">Back to Home</a></p>
    <p>Demo only: this form does not save or send your information.</p>
  </div>

  <script>
    document.getElementById("registerForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();
        document.getElementById("message").textContent =
          "Demo form works! Account creation is not enabled yet.";
      });
  </script>
</body>
</html>
